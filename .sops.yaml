# sops-nix configuration
# Secrets are encrypted with age keys. Each host has its own age key derived
# from its SSH host key. To add a new secret:
#
#   1. Add it to hosts/<host>/secrets.yaml
#   2. Run: sops updatekeys hosts/<host>/secrets.yaml
#   3. Access in NixOS config as: config.sops.secrets.<name>.path
#
# To set up a new host:
#   $ nix-shell -p ssh-to-age --run "ssh-keyscan <host> | ssh-to-age"
#   Add the age key below.

keys:
  - &homeserver-edt age1g79q4cadrwz2fncgrsw77c04vkvfq6xpv46s0czvvm8n2475k3qstk6hf0
  - &edeetee age1ajfkycqvdpagukxpp5ra4c9jr23x5797q7p36y4z3gqud5l6y4uqfs57q3

creation_rules:
  - path_regex: hosts/homeserver-edt/secrets\.yaml$
    key_groups:
      - age:
          - *homeserver-edt
          - *edeetee
